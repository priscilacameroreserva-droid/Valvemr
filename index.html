<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Plataforma VR</title>
<style>
html,body{margin:0;height:100%;background:#05060f;color:#e8ecff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 30%,#1b1f5a,#05060f)}
#ov h1{margin:0;font-size:26px;letter-spacing:3px}
#ov p{margin:0;max-width:520px;font-size:14px;opacity:.85;line-height:1.45}
#go{font-size:18px;padding:14px 28px;border:0;border-radius:30px;background:linear-gradient(90deg,#00e0ff,#7a5cff);color:#04061a;font-weight:700}
#st{font-size:13px;color:#8fe;min-height:18px}
#mid{position:fixed;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#000;display:none;z-index:2}
#v{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="ov">
  <h1>PLATAFORMA VR</h1>
  <p>Coloque o celular no VR Box com a câmera traseira livre. Mantenha as mãos à frente do rosto, a uns 30–50 cm. Na primeira vez é preciso internet para baixar a IA das mãos.</p>
  <button id="go">ENTRAR NA REALIDADE VIRTUAL</button>
  <div id="st"></div>
</div>
<div id="mid"></div>
<video id="v" playsinline muted></video>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {HandLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3';

/* ===== CONFIGURAÇÕES (salvas no aparelho) ===== */
const S=Object.assign({vol:.6,q:1,sens:1,hands:0},(()=>{try{return JSON.parse(localStorage.getItem('vrp'))||{}}catch(e){return {}}})());
const save=()=>{try{localStorage.setItem('vrp',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),st=t=>$('st').textContent=t;
const D2R=Math.PI/180,MZ=1.4,TX=.64; // MZ = distância do menu; TX = tan(metade do campo de visão da câmera)

/* ===== ÁUDIO ===== */
let AC,master;
function audioInit(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=S.vol;master.connect(AC.destination);
  [110,165].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f*(1+i*.004);g.gain.value=.05;o.connect(g).connect(master);o.start()});
}
function tone(f,d=.12,t='sine',v=.2){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g).connect(master);o.start();o.stop(AC.currentTime+d);
}

/* ===== SISTEMA VR: cena, câmeras estéreo, giroscópio ===== */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070a1c);scene.fog=new THREE.Fog(0x070a1c,4,18);
const rig=new THREE.Group();rig.position.y=1.6;scene.add(rig);
const cam=new THREE.PerspectiveCamera(80,1,.05,60);rig.add(cam);
const handsG=new THREE.Group();rig.add(handsG);
const QP=[.6,.85,1];
function resize(){renderer.setPixelRatio(QP[S.q]*Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);

let dev=null;addEventListener('deviceorientation',e=>{if(e.alpha!=null)dev=e});
const qd=new THREE.Quaternion(),qA=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2),
      eu=new THREE.Euler(),Z=new THREE.Vector3(0,0,1),Y=new THREE.Vector3(0,1,0),yawFix=new THREE.Quaternion();
let needCal=true;
function gyro(){
  if(!dev)return;
  const o=(screen.orientation?screen.orientation.angle:(window.orientation||0))*D2R;
  eu.set(dev.beta*D2R,dev.alpha*D2R,-dev.gamma*D2R,'YXZ');qd.setFromEuler(eu);qd.multiply(q1);qd.multiply(qA.setFromAxisAngle(Z,-o));
  if(needCal){const d=new THREE.Vector3(0,0,-1).applyQuaternion(qd);yawFix.setFromAxisAngle(Y,-Math.atan2(-d.x,-d.z));needCal=false}
  rig.quaternion.copy(yawFix).multiply(qd);
}

/* ===== AMBIENTE 3D ===== */
scene.add(new THREE.HemisphereLight(0x8ab4ff,0x1a1030,.7));
const sun=new THREE.DirectionalLight(0xbfd4ff,1.1);sun.position.set(2,5,3);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6});scene.add(sun);
[[0x00e0ff,-1.8],[0xff3fa4,1.8]].forEach(([c,x])=>{const l=new THREE.PointLight(c,7,9,2);l.position.set(x,2.2,-.8);scene.add(l)});
(function env(){
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  x.fillStyle='#0a0f2a';x.fillRect(0,0,256,256);x.strokeStyle='#17c7ff';x.lineWidth=3;x.strokeRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(14,14);
  const f=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.MeshStandardMaterial({map:t,roughness:.45,metalness:.6}));
  f.rotation.x=-Math.PI/2;f.receiveShadow=true;scene.add(f);
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2,h=1.5+(i%3);
    const p=new THREE.Mesh(new THREE.BoxGeometry(.5,h,.5),new THREE.MeshStandardMaterial({color:0x10163f,emissive:i%2?0xff3fa4:0x00e0ff,emissiveIntensity:.35,roughness:.4}));
    p.position.set(Math.sin(a)*6,h/2,Math.cos(a)*6);p.castShadow=true;scene.add(p)}
  const sp=new Float32Array(1200);for(let i=0;i<400;i++){const a=Math.random()*6.28,b=Math.random()*1.4,r=22;sp[i*3]=Math.cos(a)*Math.cos(b)*r;sp[i*3+1]=Math.sin(b)*r+1;sp[i*3+2]=Math.sin(a)*Math.cos(b)*r}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xaad8ff,size:.09,fog:false})));
})();
const rings=[0,1].map(i=>{const r=new THREE.Mesh(new THREE.TorusGeometry(1.5+i*.35,.015,8,120),new THREE.MeshBasicMaterial({color:i?0xff3fa4:0x00e0ff}));
  r.position.set(0,1.6,-MZ-.5);scene.add(r);return r});

/* ===== UI 3D: texto, painéis, botões ===== */
function mkText(w,h,px,txt,col='#fff',bold=true){
  const c=document.createElement('canvas');c.width=Math.round(w*600);c.height=Math.round(h*600);
  const x=c.getContext('2d'),tex=new THREE.CanvasTexture(c);tex.anisotropy=4;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
  m.set=(t,c2=col)=>{x.clearRect(0,0,c.width,c.height);x.fillStyle=c2;x.font=(bold?'700 ':'400 ')+px+'px system-ui,sans-serif';
    x.textAlign='center';x.textBaseline='middle';const L=String(t).split('\n');
    L.forEach((l,i)=>x.fillText(l,c.width/2,c.height/2+(i-(L.length-1)/2)*px*1.25));tex.needsUpdate=true};
  m.set(txt);return m;
}
function panel(w,h,title){
  const g=new THREE.Group();g.position.set(0,1.6,-MZ);g.visible=false;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,.05),new THREE.MeshPhysicalMaterial({color:0x0b1038,transparent:true,opacity:.78,roughness:.2,metalness:.3,clearcoat:1}));
  b.castShadow=true;g.add(b);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry),new THREE.LineBasicMaterial({color:0x00e0ff})));
  const t=mkText(w*.9,.18,76,title,'#7fe9ff');t.position.set(0,h/2-.14,.03);g.add(t);
  g.btns=[];g.w=w;g.h=h;scene.add(g);return g;
}
function button(p,x,y,w,h,txt,act,px=58){
  const g=new THREE.Group();g.position.set(x,y,.04);
  const mat=new THREE.MeshStandardMaterial({color:0x1b2470,emissive:0x2a6bff,emissiveIntensity:.15,roughness:.35,metalness:.4});
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,.06),mat);body.castShadow=true;g.add(body);
  const t=mkText(w,h,px,txt);t.position.z=.035;g.add(t);p.add(g);
  const b={g,w,h,x,y,act,mat,hov:0,hoverT:0,press:0,pressT:0,set:s=>t.set(s)};p.btns.push(b);return b;
}

/* ===== TELAS ===== */
const scr={};let cur=null,busy=false;
function go(n){ // impede abrir duas telas ao mesmo tempo
  if(busy)return;busy=true;if(cur)cur.visible=false;
  cur=scr[n];cur.visible=true;cur.scale.setScalar(.85);tone(660,.15,'triangle');setTimeout(()=>busy=false,500);
}
const QN=['BAIXA','MÉDIA','ALTA'],HN=['SÓLIDA','CONTORNO','ESQUELETO'];

scr.main=panel(1.5,1.55,'PLATAFORMA VR');
let games=[];
button(scr.main,0,.32,1,.2,'▶  PLAY',()=>games.length?launch(games[0]):go('lib'));
button(scr.main,0,.07,1,.2,'JOGOS',()=>go('lib'));
button(scr.main,0,-.18,1,.2,'CONFIGURAÇÕES',()=>go('cfg'),50);
button(scr.main,0,-.43,1,.2,'SAIR',()=>exitVR());

scr.cfg=panel(1.5,1.9,'CONFIGURAÇÕES');
const bVol=button(scr.cfg,0,.56,1.2,.18,'',()=>{S.vol=((Math.round(S.vol*5)+1)%6)/5;applyS()},44);
const bQ=button(scr.cfg,0,.33,1.2,.18,'',()=>{S.q=(S.q+1)%3;applyS()},44);
const bSens=button(scr.cfg,0,.10,1.2,.18,'',()=>{S.sens=(S.sens+1)%3;applyS()},44);
const bHands=button(scr.cfg,0,-.13,1.2,.18,'',()=>{S.hands=(S.hands+1)%3;applyS()},44);
button(scr.cfg,0,-.36,1.2,.18,'RECENTRAR VISÃO',()=>{needCal=true},44);
button(scr.cfg,0,-.68,.7,.16,'VOLTAR',()=>go('main'),48);

scr.lib=panel(2.4,1.6,'JOGOS');
const libBack=button(scr.lib,0,-.65,.7,.14,'VOLTAR',()=>go('main'),46);
const libDyn=new THREE.Group();scr.lib.add(libDyn);
function launch(g){if(g&&g.url)location.href=g.url}
function wrap(s,n){const w=String(s||'').split(' ');let l='',o=[];w.forEach(x=>{if((l+' '+x).length>n){o.push(l);l=x}else l=(l+' '+x).trim()});o.push(l);return o.slice(0,4).join('\n')}
function buildLib(){
  while(libDyn.children.length)libDyn.remove(libDyn.children[0]);
  scr.lib.btns=[libBack];
  if(!games.length){
    for(let i=-1;i<=1;i++){const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(.6,.85,.02)),new THREE.LineBasicMaterial({color:0x2a6bff,transparent:true,opacity:.4}));e.position.set(i*.75,.02,.03);libDyn.add(e)}
    const t=mkText(2,.4,70,'BIBLIOTECA VAZIA\nNenhum jogo instalado ainda.','#cfe8ff');t.position.set(0,.1,.05);libDyn.add(t);
    const t2=mkText(1.8,.2,34,'Novos jogos aparecerão aqui assim que forem adicionados.','#8fb4ff',false);t2.position.set(0,-.2,.05);libDyn.add(t2);
    return;
  }
  games.slice(0,3).forEach((g,i)=>{
    const x=(games.length==1?0:(i-(Math.min(3,games.length)-1)/2))*.75,card=new THREE.Group();card.position.set(x,.05,.03);libDyn.add(card);
    const fr=new THREE.Mesh(new THREE.BoxGeometry(.68,.95,.03),new THREE.MeshStandardMaterial({color:0x141b55,roughness:.4}));card.add(fr);
    const im=new THREE.Mesh(new THREE.PlaneGeometry(.6,.34),new THREE.MeshBasicMaterial({color:0x223088}));im.position.set(0,.27,.02);card.add(im);
    if(g.image)new THREE.TextureLoader().load(g.image,t=>{t.colorSpace=THREE.SRGBColorSpace;im.material.map=t;im.material.color.set(0xffffff);im.material.needsUpdate=true});
    const n=mkText(.64,.1,44,g.name||'Jogo','#fff');n.position.set(0,.02,.02);card.add(n);
    const d=mkText(.64,.26,30,wrap(g.description,26),'#a9c4ff',false);d.position.set(0,-.14,.02);card.add(d);
    button(scr.lib,x,-.3,.5,.13,'INICIAR',()=>launch(g),44);
  });
}
fetch('games.json?'+Date.now()).then(r=>r.json()).then(j=>{games=Array.isArray(j)?j:[]}).catch(()=>{games=[]}).finally(buildLib);

const status=mkText(1.4,.1,34,'MÃOS: 0','#7fe9ff',false);status.position.set(0,.62,-MZ);scene.add(status);

function applyS(){
  if(master)master.gain.value=S.vol;
  resize();renderer.shadowMap.enabled=S.q>0;sun.castShadow=S.q>0;
  scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});
  hands.forEach(h=>h.mode());
  bVol.set('VOLUME: '+Math.round(S.vol*100)+'%');bQ.set('QUALIDADE: '+QN[S.q]);
  bSens.set('SENSIBILIDADE DA PINÇA: '+QN[S.sens]);bHands.set('MÃOS: '+HN[S.hands]);save();
}

/* ===== MÃOS 3D COMPLETAS ===== */
const FING=[[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]];
const R=[.016,.012,.011,.0095,.008,.011,.0095,.008,.007,.011,.0095,.008,.007,.011,.0095,.008,.007,.010,.0085,.0075,.0065];
const sph=new THREE.SphereGeometry(1,14,10),cyl=new THREE.CylinderGeometry(1,1,1,10);
const tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
class Hand{
  constructor(){
    this.g=new THREE.Group();this.g.visible=false;handsG.add(this.g);
    this.p=Array.from({length:21},()=>new THREE.Vector3());this.has=false;this.last=0;this.d=.5;this.rf=1;
    this.pinch=false;this.cnt=0;this.pinchR=1;this.fist=false;this.hover=null;this.locked=null;this.hit=null;
    this.mat=new THREE.MeshStandardMaterial({color:0xe8b090,roughness:.55});
    this.tipMat=new THREE.MeshStandardMaterial({color:0xe8b090,emissive:0x00e0ff,emissiveIntensity:0,roughness:.4});
    this.j=R.map((r,i)=>{const m=new THREE.Mesh(sph,(i==4||i==8)?this.tipMat:this.mat);this.g.add(m);return m});
    this.b=[];FING.forEach(f=>{for(let k=0;k<4;k++){const m=new THREE.Mesh(cyl,this.mat);m.userData=[f[k],f[k+1]];this.g.add(m);this.b.push(m)}});
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(18),3));
    geo.setIndex([0,1,2,0,2,3,0,3,4,0,4,5]);
    this.pm=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xe8b090,roughness:.6,side:THREE.DoubleSide}));
    this.pm.frustumCulled=false;this.g.add(this.pm);
    this.cursor=new THREE.Mesh(new THREE.RingGeometry(.018,.027,32),new THREE.MeshBasicMaterial({color:0x00e0ff,depthTest:false,transparent:true}));
    this.cursor.renderOrder=10;this.cursor.visible=false;scene.add(this.cursor);
    this.beam=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0x00e0ff,transparent:true,opacity:.45,depthTest:false}));
    this.beam.frustumCulled=false;this.beam.visible=false;scene.add(this.beam);
    this.mode();
  }
  mode(){
    const m=S.hands;this.mat.wireframe=m==1;this.mat.color.set(m==1?0x00e0ff:0xe8b090);this.mat.emissive.set(m==1?0x0088aa:0);
    this.pm.material.wireframe=m==1;this.pm.material.color.copy(this.mat.color);this.pm.material.emissive.copy(this.mat.emissive);
    this.pm.visible=m!=2;this.rf=m==2?.4:1;
  }
  set(lm,asp,now){
    const q=Math.max(.03,Math.hypot(lm[0].x-lm[9].x,(lm[0].y-lm[9].y)/asp));
    const d=Math.min(.9,Math.max(.18,.095/(2*TX*q)));this.d=this.has?this.d*.6+d*.4:d;
    const K=2*TX*this.d;
    for(let i=0;i<21;i++){tmp.set((lm[i].x-.5)*K,(.5-lm[i].y)*K/asp,-this.d-lm[i].z*K*.8);this.has?this.p[i].lerp(tmp,.55):this.p[i].copy(tmp)}
    this.has=true;this.last=now;this.g.visible=true;this.shape();
  }
  shape(){
    const p=this.p;
    this.j.forEach((m,i)=>{m.position.copy(p[i]);m.scale.setScalar(R[i]*this.rf)});
    this.b.forEach(m=>{const [a,c]=m.userData;tmp.copy(p[c]).sub(p[a]);const L=tmp.length();
      m.position.copy(p[a]).addScaledVector(tmp,.5);m.quaternion.setFromUnitVectors(Y,tmp.normalize());
      const r=(R[a]+R[c])/2*this.rf*.92;m.scale.set(r,L,r)});
    const pa=this.pm.geometry.attributes.position;[0,1,5,9,13,17].forEach((k,i)=>pa.setXYZ(i,p[k].x,p[k].y,p[k].z));
    pa.needsUpdate=true;this.pm.geometry.computeVertexNormals();
    const pl=p[0].distanceTo(p[9]);
    this.pinchR=p[4].distanceTo(p[8])/pl; // pinça: polegar perto do indicador
    this.fist=[8,12,16,20].reduce((s,k)=>s+p[k].distanceTo(p[0]),0)/4/pl<1.25; // mão fechada
    this.tipMat.emissiveIntensity=this.pinch?1.2:Math.max(0,(.6-this.pinchR))*.8;
  }
  lose(){this.has=false;this.g.visible=false;this.cursor.visible=false;this.beam.visible=false;
    if(this.pinch)this.pinch=false;this.locked=null;this.hover=null}
}
const hands=[new Hand(),new Hand()];

/* ===== INTERAÇÃO POR PINÇA ===== */
let lockUntil=0;const pulses=[];
function activate(b,now){
  if(busy||now<lockUntil)return;lockUntil=now+600;tone(880,.14,'triangle',.25);b.act();
}
function interact(h,now){
  if(!h.has||!cur||busy){h.cursor.visible=h.beam.visible=false;h.hover=null;return}
  // raio da cabeça passando pela ponta do indicador
  const tip=handsG.localToWorld(h.p[8].clone()),o=rig.position,dir=tip.clone().sub(o).normalize();
  h.hit=null;let target=null;
  if(dir.z<-.05){
    const t=(-MZ+.05-o.z)/dir.z,hit=o.clone().addScaledVector(dir,t);h.hit=hit;
    const lx=hit.x-cur.position.x,ly=hit.y-cur.position.y;
    for(const b of cur.btns)if(Math.abs(lx-b.x)<b.w/2&&Math.abs(ly-b.y)<b.h/2){target=b;break}
  }
  h.hover=h.pinch&&h.locked?h.locked:target;
  // reconhecimento de pinça com histerese (evita cliques acidentais)
  const th=[.22,.3,.38][S.sens];
  if(!h.pinch){
    if(h.pinchR<th){if(++h.cnt>=2){h.pinch=true;h.cnt=0;h.locked=target;
      if(target){target.pressT=1;tone(520,.08,'square',.12);pulses.push({m:mkPulse(h.hit),t:0})}}}
    else h.cnt=0;
  }else if(h.pinchR>th+.14){
    h.pinch=false;const b=h.locked;h.locked=null;
    if(b){b.pressT=0;if(target===b)activate(b,now)}
  }
  if(h.hit){
    h.cursor.visible=h.beam.visible=true;h.cursor.position.copy(h.hit).z+=.04;
    h.cursor.scale.setScalar(h.pinch?.6:1+Math.max(0,.4-h.pinchR));h.cursor.material.color.set(h.pinch?0xffffff:target?0x7fffb0:0x00e0ff);
    const a=h.beam.geometry.attributes.position;a.setXYZ(0,tip.x,tip.y,tip.z);a.setXYZ(1,h.hit.x,h.hit.y,h.hit.z);a.needsUpdate=true;
  }else h.cursor.visible=h.beam.visible=false;
}
function mkPulse(p){
  const m=new THREE.Mesh(new THREE.RingGeometry(.03,.04,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthTest:false}));
  m.position.copy(p||new THREE.Vector3(0,-9,0)).z+=.05;m.renderOrder=11;scene.add(m);return m;
}

/* ===== RASTREAMENTO (MediaPipe) ===== */
const vid=$('v');let landmarker=null,stream=null,lastT=-1,running=false;
function track(now){
  if(!landmarker||vid.readyState<2||vid.currentTime===lastT)return;
  lastT=vid.currentTime;
  const res=landmarker.detectForVideo(vid,performance.now()),list=(res.landmarks||[]).slice().sort((a,b)=>a[0].x-b[0].x),asp=vid.videoWidth/vid.videoHeight||1.33;
  list.forEach((l,i)=>hands[list.length==1?(l[0].x<.5?0:1):i].set(l,asp,now));
}

/* ===== LOOP PRINCIPAL ===== */
let fr=0;
function frame(now){
  requestAnimationFrame(frame);if(!running)return;
  track(now);hands.forEach(h=>{if(h.has&&now-h.last>300)h.lose()});
  gyro();rig.updateMatrixWorld(true);
  if(cur){cur.scale.setScalar(Math.min(1,cur.scale.x+(1-cur.scale.x)*.18));cur.btns.forEach(b=>b.hoverT=0);
    hands.forEach(h=>interact(h,now));
    hands.forEach(h=>{if(h.hover)h.hover.hoverT=1;if(h.locked&&h.pinch)h.locked.pressT=1});

    cam.position.x=e*.032;cam.aspect=(w/2)/h;cam.updateProjectionMatrix();renderer.render(scene,cam)}
}
